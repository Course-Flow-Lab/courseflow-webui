<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <meta name="description" content="Courseflow 课程工作台：连接学习平台，管理课程与任务。">
    <title>Courseflow · 课程工作台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234c66c7'/%3E%3Cpath d='M9 10h14M9 16h10M9 22h14' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/src/style.css">
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#page">跳到主要内容</a>
    <section id="auth" class="auth-screen" aria-label="站点登录">
      <div class="auth-card"><div class="brand"><span class="brand-mark">≋</span>Courseflow</div><h1>正在打开工作台</h1><p class="muted">读取站点状态…</p></div>
    </section>
    <div id="workspace" class="app" hidden>
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#/courses"><span class="brand-mark" aria-hidden="true">≋</span>Courseflow<span class="brand-label">工作台</span></a>
        <button class="sidebar-search" data-action="find"><span>查找课程</span><kbd>⌘ K</kbd></button>
        <nav id="sidebar-nav"></nav>
        <div class="sidebar-foot">
          <div class="sidebar-note"><span class="status-dot"></span>你的课程，有序进行</div>
          <a id="account-link" class="account-button" href="#/account"></a>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <a class="mobile-brand" href="#/courses"><span class="brand-mark" aria-hidden="true">≋</span>Courseflow</a>
          <div id="breadcrumb" class="breadcrumb">工作台</div>
          <div class="topbar-tools"><span id="connection-status" class="connection-status" role="status">连接中</span><span id="version" class="version"></span><button class="icon-button" data-action="theme" aria-label="切换深浅主题" title="切换深浅主题">◐</button></div>
        </header>
        <div id="page-scroll" class="page-scroll">
          <div id="quiet-banner" class="quiet-banner" role="status" hidden></div>
          <div id="page-error" class="banner error-banner" role="alert" hidden></div>
          <section id="page" class="page" tabindex="-1"></section>
        </div>
        <section id="taskbar" class="taskbar" aria-label="当前任务" hidden></section>
      </main>
      <nav id="mobile-nav" class="mobile-tabs" aria-label="移动导航"></nav>
    </div>
    <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript>Courseflow 需要启用 JavaScript 才能管理课程。</noscript>
  </body>
</html>
