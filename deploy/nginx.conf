# 用 nginx -p <部署目录>/ -c <本配置绝对路径> 启动；html 指向 WebUI 的 dist。
daemon off;
worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/x-icon ico;
        font/woff2 woff2;
    }
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    server {
        listen 127.0.0.1:8100;
        server_name localhost 127.0.0.1;
        root html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control no-cache always;

        location /api/ {
            # 不添加 URI 后缀、不做 rewrite，保留 %2F 等不透明标识。
            proxy_pass http://127.0.0.1:8101;
            proxy_set_header Host $http_host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        location = /healthz {
            proxy_pass http://127.0.0.1:8101;
            proxy_set_header Host $http_host;
        }
        location / {
            # 前端使用 hash 路由，不需要将未知文件回退成 index.html。
            try_files $uri $uri/ =404;
        }
    }
}
